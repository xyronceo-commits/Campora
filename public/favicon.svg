    </style>
  </defs>
  <!-- Background Circle for contrast in dark/light browser tabs -->
  <circle cx="256" cy="256" r="248" fill="#10b981" opacity="0.12"/>
  
  <!-- Map Pin Body -->
  <path class="pin" d="M 256 32 C 158.8 32 80 110.8 80 208 C 80 322.8 232 462.4 248.8 477.6 C 252.8 481.2 259.2 481.2 263.2 477.6 C 280 462.4 432 322.8 432 208 C 432 110.8 353.2 32 256 32 Z" />
  
  <!-- Inner Circle Cutout Background -->
  <circle cx="256" cy="192" r="112" fill="#0f172a" />
  
  <!-- White Roof & Chimney Motif inside Pin Head -->
